# Fairfood Trace - Self-Hosted Nginx Config
# Dashboard on /  |  Admin on /admin  |  API on /api + /v2

upstream trace_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # ── API routes ─────────────────────────────────────────────
    # Proxy all API and Django admin requests to the backend
    location /v2/ {
        proxy_pass http://trace_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://trace_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /o/ {
        proxy_pass http://trace_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-admin/ {
        proxy_pass http://trace_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://trace_api;
    }

    # ── Admin Frontend ─────────────────────────────────────────
    location /admin/ {
        alias /usr/share/nginx/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ── Dashboard Frontend (default) ──────────────────────────
    location / {
        root /usr/share/nginx/dashboard;
        try_files $uri $uri/ /index.html;
    }
}
