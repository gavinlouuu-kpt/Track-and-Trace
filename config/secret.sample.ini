# Fairfood Trace - Self-Hosted Configuration
# Copy to secret.ini and fill in your values
# This file is read by Django settings via RawConfigParser

[app]
SECRET_KEY = your-django-secret-key-change-this
ROOT_URL = http://localhost:8000
NAVIGATE_URL = http://localhost:8000
FRONT_ROOT_URL = http://localhost
ADMIN_FRONT_ROOT_URL = http://localhost/admin
LOGIN_ROOT_URL = http://localhost/login
CI_URL = http://localhost/story
DEPLOYMENT = development
ALLOWED_ROOT = localhost

[database]
DB_NAME = trace_db
DB_USER = trace_user
DB_PASSWORD = trace_pass
DB_HOST = db
DB_PORT = 5432
REDIS_URL = redis://redis
REDIS_PORT = 6379
NEO4J_USERNAME = neo4j
NEO4J_PASSWORD = trace_neo4j_pass

[email]
EMAIL_HOST = smtp.gmail.com
EMAIL_PORT = 587
EMAIL_HOST_USER = your-email@gmail.com
EMAIL_HOST_PASSWORD = your-app-password

[libs]
HASHHID_SALT = change-this-to-random-string
TOTP_TOKEN = CHANGE_THIS_BASE32_SECRET
AWS_ACCESS_KEY_ID = your-s3-access-key
AWS_SECRET_ACCESS_KEY = your-s3-secret-key
AWS_STORAGE_BUCKET_NAME = trace-media
SENTRY_DSN =
PLIVO_ID = dummy
PLIVO_TOKEN = dummy
GOOGLE_OAUTH2_CLIENT_ID =
GOOGLE_OAUTH2_CLIENT_SECRET =
TRACE_OAUTH2_CLIENT_ID = will-be-generated-after-setup
TRACE_OAUTH2_CLIENT_SECRET = will-be-generated-after-setup
CONNECT_OAUTH2_CLIENT_ID = dummy
CONNECT_OAUTH2_CLIENT_SECRET = dummy

[otp]
LOGIN_TOTP_SECRET = CHANGE_THIS_BASE32_SECRET
DP_PASS_TOTP_SECRET = CHANGE_THIS_BASE32_SECRET
CI_TOTP_SECRET = CHANGE_THIS_BASE32_SECRET

# Blockchain - stubbed out (no-ops)
[blockchain]
BLOCKCHAIN_CLIENT_ID = stub
BLOCKCHAIN_ENCRYPTION_KEY = stub-key-not-used
TREASURY_ACCOUNT_ID = 0.0.0
TREASURY_ENCRYPED_PRIVATE = stub

# Guardian - stubbed out
[guardian]
GUARDIAN_URL = http://localhost:9999
GUARDIAN_SD_USER_NAME = stub
GUARDIAN_SD_USER_PASS = stub
GUARDIAN_SD_ACCOUNT_ID = stub
GUARDIAN_METH_OWNER_NAME = stub

# Connect sync - optional
[connect]
USER_NAME = stub
PASSWORD = stub
DEVICE_ID = stub

[sync]
SYNC_USER_ID = stub
SYNC_NODE_ID = stub
SYNC_USER_DEFAULT_PASSWORD = stub
CONNECT_SYNC_COMPANY_ID = stub
