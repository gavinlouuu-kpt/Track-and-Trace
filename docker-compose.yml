version: '3.8'

services:
  # ── Backend API ──────────────────────────────────────────────
  api:
    container_name: trace-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python fairtrace_v2/manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/usr/src/app/
      - ./config/secret.ini:/etc/secret/fairtrace_v2/secret.ini:ro
    ports:
      - "8000:8000"
    env_file:
      - ./config/.env
    environment:
      - SQL_HOST=db
      - SQL_PORT=5432
      - DATABASE=postgres
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      graphdb:
        condition: service_started
    entrypoint: "/usr/src/app/entrypoint.sh"
    networks:
      - trace-net

  # ── Celery Worker ────────────────────────────────────────────
  celery:
    container_name: trace-celery
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A fairtrace_v2 worker -l info -Q low,high,ci_queue
    working_dir: /usr/src/app/fairtrace_v2
    volumes:
      - ./backend:/usr/src/app/
      - ./config/secret.ini:/etc/secret/fairtrace_v2/secret.ini:ro
    env_file:
      - ./config/.env
    environment:
      - SQL_HOST=db
      - SQL_PORT=5432
    depends_on:
      - api
    networks:
      - trace-net

  # ── Celery Beat ──────────────────────────────────────────────
  celery-beat:
    container_name: trace-celery-beat
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A fairtrace_v2 beat -l info
    working_dir: /usr/src/app/fairtrace_v2
    volumes:
      - ./backend:/usr/src/app/
      - ./config/secret.ini:/etc/secret/fairtrace_v2/secret.ini:ro
    env_file:
      - ./config/.env
    environment:
      - SQL_HOST=db
      - SQL_PORT=5432
    depends_on:
      - api
    networks:
      - trace-net

  # ── PostgreSQL ───────────────────────────────────────────────
  db:
    container_name: trace-db
    image: postgres:13-alpine
    volumes:
      - trace_postgres_data:/var/lib/postgresql/data/
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trace_pass}
      POSTGRES_DB: ${POSTGRES_DB:-trace_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trace_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trace-net

  # ── Redis ────────────────────────────────────────────────────
  redis:
    container_name: trace-redis
    image: redis:6.2-alpine
    restart: always
    ports:
      - "6380:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - trace_redis_data:/data
    networks:
      - trace-net

  # ── Neo4j (Graph DB) ────────────────────────────────────────
  graphdb:
    container_name: trace-neo4j
    image: neo4j:4.4
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/trace_neo4j_pass
      NEO4J_dbms_memory_pagecache_size: 256M
      NEO4J_dbms_memory_heap_initial__size: 256M
      NEO4J_dbms_memory_heap_max__size: 512M
    volumes:
      - trace_neo4j_data:/data
      - trace_neo4j_logs:/logs
    networks:
      - trace-net

  # ── Nginx (reverse proxy + frontend static files) ───────────
  nginx:
    container_name: trace-nginx
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dashboard/dist/fairfood-trace-dashboard:/usr/share/nginx/dashboard:ro
      - ./frontend/admin/dist/fairfood-admin:/usr/share/nginx/admin:ro
    depends_on:
      - api
    networks:
      - trace-net

volumes:
  trace_postgres_data:
  trace_redis_data:
  trace_neo4j_data:
  trace_neo4j_logs:

networks:
  trace-net:
    driver: bridge
